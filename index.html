<style>
:root{
  --bg:#f4f7f6; --card:#ffffff; --text:#13201e; --muted:#5f716d; --line:#e2e9e7;
  --accent:#0f766e; --accent-2:#ccfbf1; --ing:#15803d; --gas:#c2410c; --aho:#1d4ed8;
  --warn:#b45309; --bad:#b91c1c; --ok:#15803d; --field:#f8fbfa; --shadow:0 1px 3px rgba(0,0,0,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1416; --card:#142024; --text:#e6efed; --muted:#93a8a3; --line:#22343a;
    --accent:#2dd4bf; --accent-2:#134e4a; --ing:#4ade80; --gas:#fb923c; --aho:#60a5fa;
    --warn:#fbbf24; --bad:#f87171; --ok:#4ade80; --field:#0f1a1d; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--accent);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
@media (prefers-color-scheme: dark){header{background:#0f3d39}}
header .title{font-weight:700;font-size:18px}
.month{display:flex;align-items:center;gap:4px}
.month button{background:rgba(255,255,255,.15);border:0;color:#fff;width:34px;height:34px;border-radius:10px;font-size:20px}
.month span{min-width:120px;text-align:center;font-weight:600;text-transform:capitalize}
main{padding:12px 16px calc(96px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:15px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.kpi small{color:var(--muted);display:block;font-size:12px}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums}
.c-ing{color:var(--ing)}.c-gas{color:var(--gas)}.c-aho{color:var(--aho)}.c-bad{color:var(--bad)}.c-muted{color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.row{display:flex;align-items:center;gap:8px}.end{justify-content:flex-end}.between{justify-content:space-between}
.catline{padding:8px 0;border-top:1px solid var(--line)}.catline:first-of-type{border-top:0}
.catline .top{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px}
.catline .nm{font-weight:600}.catline .am{font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;padding:2px 0 0 12px}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:var(--line);color:var(--muted);white-space:nowrap}
.tag.ok{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.tag.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.tag.bad{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.grp{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:16px 0 6px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select{width:100%;font:inherit;color:var(--text);background:var(--field);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0}
input.big{font-size:28px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:12px 16px;background:var(--accent);color:#fff;min-height:44px;cursor:pointer}
@media (prefers-color-scheme: dark){.btn{color:#042f2e}}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--bad);color:#fff}
.btn.full{width:100%}.btn.sm{padding:7px 11px;min-height:34px;font-size:13px;border-radius:10px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--line);padding:4px;border-radius:12px}
.seg button{border:0;background:transparent;font:inherit;font-weight:600;padding:9px;border-radius:9px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.seg button.on[data-k=gasto]{color:var(--gas)}.seg button.on[data-k=ingreso]{color:var(--ing)}.seg button.on[data-k=ahorro]{color:var(--aho)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:20px;padding:6px 11px;font:inherit;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.attach{display:flex;gap:8px;flex-wrap:wrap}
.thumb{display:flex;align-items:center;gap:10px;margin-top:10px;padding:8px;border:1px dashed var(--line);border-radius:10px}
.thumb img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.mov{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.mov:first-child{border-top:0}
.dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;flex:none}
.dot.ingreso{background:color-mix(in srgb,var(--ing) 15%,transparent);color:var(--ing)}
.dot.gasto{background:color-mix(in srgb,var(--gas) 15%,transparent);color:var(--gas)}
.dot.ahorro{background:color-mix(in srgb,var(--aho) 15%,transparent);color:var(--aho)}
.mov .mid{flex:1;min-width:0}.mov .mid div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mov .mid small{color:var(--muted)}
.mov .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.dayh{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-weight:700;text-transform:capitalize;margin:14px 2px 4px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.catrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.catrow:first-child{border-top:0}
.catrow .nm{flex:1;min-width:0}
.catrow.subc{padding-left:18px}.catrow.subc .nm{color:var(--muted)}
.catrow input{width:96px;min-height:36px;padding:6px 8px;text-align:right}
.icon{border:0;background:transparent;color:var(--muted);font-size:17px;width:34px;height:34px;border-radius:8px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent)}
nav button.plus span.p{width:50px;height:50px;margin-top:-22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px;box-shadow:0 4px 12px rgba(15,118,110,.4)}
@media (prefers-color-scheme: dark){nav button.plus span.p{color:#042f2e}}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px}.sheet p{margin:6px 0;color:var(--muted)}
.sheet .row.end{margin-top:16px}
.sheet img.full{max-width:100%;border-radius:10px}
#toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#13201e;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90%;text-align:center}
#toast.on{opacity:1}
.muted{color:var(--muted);font-size:13px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
a{color:var(--accent)}
.stack{display:flex;border-radius:7px;overflow:hidden;background:var(--line);margin:8px 0}
.stack i{display:block;height:100%}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:0}
.sub i{font-style:normal;opacity:.8}
.nl{display:grid;grid-template-columns:1fr 104px 34px;gap:6px;padding:10px 0;border-top:1px solid var(--line)}
.nl:first-child{border-top:0}
.nl input[data-f=concept],.nl .nlcat{grid-column:1/-1}
.nl input,.nl select{min-height:40px;padding:8px 10px;font-size:14px}
.nl input[data-f=amount]{text-align:right}
.nl .nlcat{font-size:13px;color:var(--muted)}
.opt{display:flex;gap:10px;align-items:flex-start;color:var(--text);font-size:14px;margin:12px 0}
.opt input{width:auto;min-height:0;margin-top:3px}
details summary{cursor:pointer}
.warn-box{margin-top:10px;padding:10px;border-radius:10px;background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn);font-size:13px}
</style>

<body>
<header>
  <div class="title" id="title">Panel</div>
  <div class="month" id="monthbar"><button id="mPrev" aria-label="Mes anterior">‹</button><span id="mLabel"></span><button id="mNext" aria-label="Mes siguiente">›</button></div>
</header>
<main>
  <section id="v-panel" class="view"></section>
  <section id="v-movs" class="view"></section>

</main>
<nav id="nav">
  <button data-v="panel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Panel</button>
  <button data-v="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos</button>
  <button data-v="add" class="plus"><span class="p">+</span></button>
  <button data-v="cats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8zM7.5 7.5h.01"/></svg>Categorías</button>
  <button data-v="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</button>
</nav>
<div id="modal" class="modal hidden"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
'use strict';
/* ====================== Utilidades ====================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim().replace(/\s+/g, ' ');
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => ymd(new Date());
const MONTHS = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const MSHORT = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const TYPES = ['Ingreso', 'Gasto fijo', 'Gasto variable', 'Ahorro'];
const kindOfType = t => t === 'Ingreso' ? 'ingreso' : t === 'Ahorro' ? 'ahorro' : 'gasto';
const KIND_LABEL = { gasto: 'Gasto', ingreso: 'Ingreso', ahorro: 'Ahorro' };
let FMT;
const money = n => FMT.format(n || 0);
function toast(msg, ms = 2200) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), ms); }
function parseNum(v) {
  if (typeof v === 'number') return v;
  let s = String(v ?? '').replace(/[€$£\s]|EUR|USD|COP/gi, '');
  if (!s) return NaN;
  const neg = /^-|^\(.*\)$|-$/.test(s); s = s.replace(/[()\-+]/g, '');
  const lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');
  if (lc > -1 && ld > -1) s = lc > ld ? s.replace(/\./g, '').replace(',', '.') : s.replace(/,/g, '');
  else if (lc > -1) s = /^\d{1,3}(,\d{3})+$/.test(s) ? s.replace(/,/g, '') : s.replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = parseFloat(s); return isNaN(n) ? NaN : (neg ? -n : n);
}
function loadScript(src) { return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('No se pudo cargar ' + src)); document.head.appendChild(s); }); }
const fileToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

/* ====================== Base de datos (IndexedDB, en el teléfono) ====================== */
const DB = {
  db: null,
  open() { return new Promise((res, rej) => { const r = indexedDB.open('presupuesto', 2);
    r.onupgradeneeded = () => { const d = r.result; for (const s of ['cats', 'movs', 'files', 'kv', 'nominas']) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: s === 'kv' ? 'k' : 'id' }); };
    r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(store, mode, fn) { return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const req = fn(t.objectStore(store));
    t.oncomplete = () => res(req && 'result' in req ? req.result : undefined); t.onerror = () => rej(t.error); }); },
  all(s) { return this.tx(s, 'readonly', st => st.getAll()); },
  get(s, k) { return this.tx(s, 'readonly', st => st.get(k)); },
  put(s, v) { return this.tx(s, 'readwrite', st => { st.put(v); }); },
  del(s, k) { return this.tx(s, 'readwrite', st => { st.delete(k); }); },
  clear(s) { return this.tx(s, 'readwrite', st => { st.clear(); }); },
  putMany(s, arr) { return this.tx(s, 'readwrite', st => { arr.forEach(v => st.put(v)); }); },
};

/* ====================== Sincronización entre dispositivos (Supabase, cifrada) ======================
   Cada cambio local se apunta en SY.meta ("tienda|id" → {u: fecha, p: pendiente de subir, d: borrado}).
   Al sincronizar: se bajan los cambios de la nube (gana el más reciente) y se suben los pendientes.
   Todo viaja cifrado con AES-GCM con una clave derivada de tu contraseña: el servidor no puede leerlo. */
const SUPA_URL = 'https://sogsdsxmutkdiewdcweu.supabase.co', SUPA_KEY = 'sb_publishable_bCm8yvmE6kFpF1Ovh9lOow_6ZHXo8JX'; // clave pública (segura con RLS)
const SUPA_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0/dist/umd/supabase.min.js';
const SYNCED = ['cats', 'movs', 'nominas', 'files'];
const SY = { meta: {}, last: 0, client: null, user: null, key: null, email: '', busy: false, again: false, timer: null, mt: null, status: '', err: '', lastOk: 0 };
const RAW = { put: DB.put.bind(DB), del: DB.del.bind(DB), clear: DB.clear.bind(DB), putMany: DB.putMany.bind(DB) };
const skey = (s, id) => s + '|' + id;
const isSynced = (s, k) => SYNCED.includes(s) || (s === 'kv' && k === 'settings');
function touch(s, k, deleted) { const u = Math.max(Date.now(), SY.last + 1); SY.last = u; SY.meta[skey(s, k)] = deleted ? { u, p: 1, d: 1 } : { u, p: 1 }; }
function syncChanged() {
  clearTimeout(SY.mt); SY.mt = setTimeout(() => RAW.put('kv', { k: 'sync_meta', v: SY.meta }), 300);
  if (SY.user) { clearTimeout(SY.timer); SY.timer = setTimeout(syncNow, 2000); }
}
DB.put = async (s, v) => { await RAW.put(s, v); const k = s === 'kv' ? v.k : v.id; if (isSynced(s, k)) { touch(s, k); syncChanged(); } };
DB.del = async (s, k) => { await RAW.del(s, k); if (isSynced(s, k)) { touch(s, k, true); syncChanged(); } };
DB.putMany = async (s, arr) => { await RAW.putMany(s, arr); if (SYNCED.includes(s) && arr.length) { arr.forEach(v => touch(s, v.id)); syncChanged(); } };
DB.clear = async s => {
  if (!SYNCED.includes(s)) return RAW.clear(s);
  const keys = await DB.tx(s, 'readonly', st => st.getAllKeys()); await RAW.clear(s);
  keys.forEach(k => touch(s, k, true)); syncChanged();
};

/* ====================== Estado ====================== */
const DEFAULT_CATS = [
  ['Nómina','Ingreso',1800],['Ingresos extra','Ingreso',150],['Otros ingresos','Ingreso',0],
  ['Alquiler / Hipoteca','Gasto fijo',650],['Luz y gas','Gasto fijo',80],['Agua','Gasto fijo',25],['Internet y móvil','Gasto fijo',45],
  ['Seguros','Gasto fijo',40],['Suscripciones','Gasto fijo',20],['Préstamos','Gasto fijo',0],
  ['Supermercado','Gasto variable',300],['Restaurantes','Gasto variable',80],['Transporte y gasolina','Gasto variable',120],['Ocio','Gasto variable',60],
  ['Ropa','Gasto variable',40],['Salud','Gasto variable',30],['Hogar y bricolaje','Gasto variable',40],['Regalos','Gasto variable',20],['Otros gastos','Gasto variable',30],
  ['Fondo de emergencia','Ahorro',200],['Ahorro / Inversión','Ahorro',150],
];
const S = {
  cats: [], movs: [], view: 'panel', month: today().slice(0, 7),
  settings: { currency: 'EUR', goal: 0.2, efMonths: 6, efInitial: 0 },
  add: { kind: 'gasto', editId: null, file: null, removeFile: false },
  catFilter: '', search: '', installEvt: null, nominas: [], nom: { mode: 'list' },
};
const byId = id => S.cats.find(c => c.id === id);
const topOf = c => c && c.parent ? byId(c.parent) : c;
const typeOf = c => (topOf(c) || {}).type || 'Gasto variable';
const kindOfCat = c => kindOfType(typeOf(c));
const tops = () => S.cats.filter(c => !c.parent);
const subsOf = id => S.cats.filter(c => c.parent === id).sort((a, b) => a.name.localeCompare(b.name, 'es'));
const findTop = name => tops().find(c => norm(c.name) === norm(name));
const findSub = (pid, name) => S.cats.find(c => c.parent === pid && norm(c.name) === norm(name));
const catLabel = c => !c ? 'Sin categoría' : c.parent ? `${topOf(c).name} › ${c.name}` : c.name;
const movKind = m => kindOfCat(byId(m.cat));
async function saveSettings() { await DB.put('kv', { k: 'settings', v: S.settings }); setFmt(); }
function setFmt() { FMT = new Intl.NumberFormat('es-ES', { style: 'currency', currency: S.settings.currency, maximumFractionDigits: S.settings.currency === 'COP' ? 0 : 2 }); }
async function createCat({ name, type, budget = 0, parent = null }) {
  const c = { id: uid(), name: name.trim(), type: parent ? null : type, budget: +budget || 0, parent };
  S.cats.push(c); await DB.put('cats', c); return c;
}

/* ====================== Modales ====================== */
function openModal(html) {
  let resolve; const p = new Promise(r => resolve = r);
  const m = $('#modal'), sh = $('#sheet'); sh.innerHTML = html; m.classList.remove('hidden'); sh.scrollTop = 0;
  const close = v => { m.classList.add('hidden'); sh.innerHTML = ''; resolve(v); };
  $$('[data-close]', sh).forEach(b => b.onclick = () => close(null));
  return { sh, close, p };
}
function confirmBox(title, msg, ok = 'Sí', no = 'No', danger = false) {
  const { sh, close, p } = openModal(`<h3>${title}</h3><p>${msg}</p><div class="row end"><button class="btn ghost" data-close>${no}</button><button class="btn ${danger ? 'danger' : ''}" id="mOk">${ok}</button></div>`);
  $('#mOk', sh).onclick = () => close(true); return p.then(v => !!v);
}
function typeOptions(sel) { return TYPES.map(t => `<option ${t === sel ? 'selected' : ''}>${t}</option>`).join(''); }

function chart6() {
  let [y, m] = S.month.split('-').map(Number); const data = [];
  for (let i = 5; i >= 0; i--) { let mm = m - i, yy = y; while (mm < 1) { mm += 12; yy--; } const t = totals(monthMovs(`${yy}-${pad(mm)}`)); data.push({ l: MSHORT[mm - 1], i: t.ingreso, g: t.gasto + t.ahorro }); }
  const max = Math.max(1, ...data.flatMap(d => [d.i, d.g])), W = 320, H = 120, bw = 16;
  const bars = data.map((d, k) => { const x = 12 + k * 52; const hi = d.i / max * 90, hg = d.g / max * 90;
    return `<rect x="${x}" y="${100 - hi}" width="${bw}" height="${hi}" rx="3" fill="var(--ing)"/><rect x="${x + bw + 3}" y="${100 - hg}" width="${bw}" height="${hg}" rx="3" fill="var(--gas)"/><text x="${x + bw + 1}" y="114" text-anchor="middle">${d.l}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y salidas de los últimos seis meses">${bars}</svg>
    <div class="row" style="gap:14px;font-size:12px;color:var(--muted)"><span><b class="c-ing">■</b> Ingresos</span><span><b class="c-gas">■</b> Gastos + ahorro</span></div>`;
}

function readDraft() { return { amount: $('#fAmount').value, date: $('#fDate').value, desc: $('#fDesc').value, cat: $('#fCat').value, sub: $('#fSub').value }; }
async function saveMov() {
  const d = readDraft(); S.add.draft = d;
  const amount = Math.abs(parseNum(d.amount));
  if (!amount) { toast('Escribe un importe'); $('#fAmount').focus(); return; }
  if (!d.date) { toast('Elige una fecha'); return; }

  let target = findTop(d.cat);

/* ---------- Leer factura con OCR (se descarga la primera vez, necesita internet) ---------- */
async function ocrInvoice(blob) {
  const btn = $('#tOcr'); if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span> Leyendo…'; }
  try {
    if (!window.Tesseract) await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const { data } = await Tesseract.recognize(blob, 'spa');
    const text = data.text || ''; const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
    const amtRe = /(\d{1,3}(?:[.\s]\d{3})*[.,]\d{2})(?!\d)/g;
    let amount = null;
    const totalLines = lines.filter(l => /total|importe|a pagar|pagar/i.test(l) && !/sub ?total|base/i.test(l));
    for (const l of totalLines) { const ms = l.match(amtRe); if (ms) { const v = parseNum(ms[ms.length - 1].replace(/\s/g, '')); if (v > (amount || 0)) amount = v; } }
    if (!amount) { const all = (text.match(amtRe) || []).map(s => parseNum(s.replace(/\s/g, ''))).filter(v => v > 0); if (all.length) amount = Math.max(...all); }
    const dm = text.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); let date = null;
    if (dm) { let [, dd, mm, yy] = dm; if (yy.length === 2) yy = '20' + yy; if (+mm >= 1 && +mm <= 12 && +dd >= 1 && +dd <= 31) date = `${yy}-${pad(mm)}-${pad(dd)}`; }
    const vendor = lines.find(l => /[a-záéíóúñ]{3,}/i.test(l) && l.length > 2 && l.length < 40);
    let found = [];

/* ====================== Nómina: leerla y desglosarla ====================== */
const PDFJS = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
const TESS = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
const NOM_KINDS = { dev: 'Cobro en dinero', esp: 'Cobro en especie', irpf: 'Hacienda (IRPF)', ss: 'Seguridad Social', emb: 'Embargo / deuda', aho: 'Ahorro / pensiones', espded: 'Descuento en especie', otra: 'Otra deducción' };
const NOM_DEST = { // a dónde va cada euro (orden del gráfico)
  neto: ['Te llega al banco', 'var(--ing)', '💶'], irpf: ['Hacienda (IRPF)', 'var(--gas)', '🏛️'], ss: ['Seguridad Social', 'var(--aho)', '🩺'],
  emb: ['Embargos / deudas', 'var(--bad)', '⚖️'], aho: ['Ahorro / pensiones', '#8b5cf6', '🐷'], esp: ['En especie (beneficios)', 'var(--warn)', '🎁'], otra: ['Otras deducciones', 'var(--muted)', '•'] };
const NOM_DEFCAT = { irpf: 'Impuestos y cotizaciones › IRPF', ss: 'Impuestos y cotizaciones › Seguridad Social', emb: 'Deudas y embargos', aho: 'Ahorro / Inversión › Plan de pensiones', otra: 'Otros gastos' };
const SS_INFO = [[/comun/, 'pensiones, bajas y sanidad'], [/desempleo/, 'el paro'], [/formacion/, 'formación de trabajadores'], [/equidad|mei/, 'hucha de las pensiones'], [/extra/, 'cotización de horas extra']];
const MONEY_RE = /-?\d{1,3}(?:\.\d{3})+,\d{2}|-?\d{1,3}(?:,\d{3})+\.\d{2}|-?\d+,\d{2}|-?\d+\.\d{2}/g;
const PCT_RE = /\(?\s*\d{1,2}[.,]\d{1,3}\s*%\s*\)?/g;
const monthName = ym => { const [y, m] = ym.split('-').map(Number); return `${MONTHS[m - 1]} ${y}`; };
const r2 = v => Math.round(v * 100) / 100;
function espCat(concept) {
  const c = norm(concept);
  if (/ticket|restaur|comida|comedor|meal|cheque/.test(c)) return 'Restaurantes › Ticket restaurante';
  if (/med|salud|dental|sanitar|health/.test(c)) return 'Salud › Seguro médico';
  if (/life|vida/.test(c)) return 'Seguros › Seguro de vida';
  if (/transport/.test(c)) return 'Transporte y gasolina › Tarjeta transporte';
  if (/guarder|nursery/.test(c)) return 'Otros gastos › Guardería';
  return 'Otros gastos › Retribución en especie';
}
function nomTotals(n) {
  const t = { dev: 0, esp: 0, irpf: 0, ss: 0, emb: 0, aho: 0, espded: 0, otra: 0 };
  for (const l of n.lines) t[l.kind] += Math.abs(parseNum(l.amount)) || 0;
  t.bruto = t.dev + t.esp; t.ded = t.irpf + t.ss + t.emb + t.aho + t.otra + t.espded; t.calc = t.bruto - t.ded;
  const nn = parseNum(n.neto); t.neto = isNaN(nn) ? t.calc : nn;
  // El descuento en especie compensa los cobros en especie: el dinero "se va" a esos beneficios
  t.dest = { neto: t.neto, irpf: t.irpf, ss: t.ss, emb: t.emb, aho: t.aho, esp: t.espded ? Math.min(t.esp, t.espded) : 0, otra: t.otra + Math.max(0, t.espded - t.esp) };
  t.total = Object.values(t.dest).reduce((a, b) => a + b, 0);

}
/* Texto de la nómina: PDF digital → texto directo; PDF escaneado o foto → OCR en el propio teléfono */
async function extractText(blob, onStatus) {
  let images = [];
  if (blob.type === 'application/pdf' || /\.pdf$/i.test(blob.name || '')) {
    onStatus('Abriendo el PDF…');
    if (!window.pdfjsLib) { await loadScript(PDFJS + 'pdf.min.js'); pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js'; }
    const pdf = await pdfjsLib.getDocument({ data: await blob.arrayBuffer() }).promise;
    const pages = [];
    for (let p = 1; p <= Math.min(pdf.numPages, 4); p++) {
      const tc = await (await pdf.getPage(p)).getTextContent(); const rows = [];
      for (const it of tc.items) { if (!it.str.trim()) continue; const y = it.transform[5]; let r = rows.find(r => Math.abs(r.y - y) < 3); if (!r) rows.push(r = { y, items: [] }); r.items.push({ x: it.transform[4], s: it.str }); }
      pages.push(rows.sort((a, b) => b.y - a.y).map(r => r.items.sort((a, b) => a.x - b.x).map(i => i.s).join(' ')).join('\n'));
    }
    const text = pages.join('\n@@PAGINA@@\n');
    if (text.replace(/\s/g, '').length > 150) return text;
    for (let p = 1; p <= Math.min(pdf.numPages, 4); p++) { // escaneado: se renderiza cada página para el OCR
      const pg = await pdf.getPage(p), vp = pg.getViewport({ scale: 3 }), cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height; const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
      await pg.render({ canvasContext: ctx, viewport: vp }).promise; images.push(cv);
    }
  } else images = [blob];
  onStatus('Preparando el lector de texto…');
  if (!window.Tesseract) await loadScript(TESS);
  const out = [];
  for (let i = 0; i < images.length; i++) {
    const { data } = await Tesseract.recognize(images[i], 'spa', { logger: m => { if (m.status === 'recognizing text') onStatus(`Leyendo página ${i + 1} de ${images.length}… ${Math.round(m.progress * 100)} %`); } });
    out.push(data.text || '');
  }
  return out.join('\n@@PAGINA@@\n');
}
function parsePayslip(text) {
  const L = text.split('\n').map(l => l.replace(/\s+/g, ' ').trim());
  const amountsOf = s => (s.replace(PCT_RE, ' ').match(MONEY_RE) || []).map(v => Math.abs(parseNum(v))).filter(v => v > 0);
  const lines = [], seen = new Set(); let neto = null, stop = false;
  for (let i = 0; i < L.length; i++) {
    const raw = L[i], l = norm(raw);
    if (raw === '@@PAGINA@@') { stop = false; continue; } // nueva página: vuelve a leer conceptos
    if (/liquido|neto a percibir|total a percibir/.test(l)) {
      for (let j = i; j <= i + 3 && j < L.length; j++) { const a = amountsOf(L[j]); if (a.length) { if (neto == null) neto = a[a.length - 1]; break; } }
      stop = true; continue;
    }
    if (/^fecha|sello empresa|banco:|determinacion de las bases|aportacion empresa|^base sujeta/.test(l)) { stop = true; continue; }
    if (stop || !/[a-z]{3,}/.test(l) || /total|^base|^rem\.|n\.?i\.?f|c\.?i\.?f|afiliacion/.test(l)) continue;
    const am = amountsOf(raw); if (!am.length) continue;
    const amount = am[am.length - 1];
    const pm = raw.match(/(\d{1,2}[.,]\d{1,3})\s*%/), pct = pm ? parseNum(pm[1]) : null;
    let concept = raw.replace(PCT_RE, ' ').replace(MONEY_RE, ' ').replace(/[|*_]/g, ' ').replace(/^[\s\d.,\-]+/, '').replace(/\s+/g, ' ').trim();
    concept = concept ? concept[0].toUpperCase() + concept.slice(1).toLowerCase() : 'Concepto';
    let kind;
    if (/especie/.test(l)) kind = 'espded';
    else if (/embargo/.test(l)) kind = 'emb';
    else if (/irpf|i\.r\.p\.f|tributacion|retencion|imp\.? ?ingr|ingreso a cuenta/.test(l)) kind = 'irpf';
    else if (/cotizacion|contingencias|desempleo|formacion prof|equidad|\bmei\b/.test(l)) { if (pct && pct > 5) continue; kind = 'ss'; } // >5 % es la parte de la empresa
    else if (/pension|aport/.test(l)) kind = 'aho';
    else if (/anticipo|sindical|prestamo|descuento|dcto|^-/.test(l)) kind = 'otra';
    else kind = /insurance|seguro|med ins|medic|salud|dental|ticket|restaur|comedor|guarder|life|vida|sacrif|flex|especie/.test(l) ? 'esp' : 'dev';
    const key = norm(concept) + '|' + amount; if (seen.has(key)) continue; seen.add(key);
    lines.push({ concept, kind, amount, cat: kind === 'esp' ? espCat(concept) : (NOM_DEFCAT[kind] || '') });
  }
  const order = Object.keys(NOM_KINDS); lines.sort((a, b) => order.indexOf(a.kind) - order.indexOf(b.kind));
  const T = norm(text); let month = null, mm;
  if ((mm = T.match(new RegExp(`(${MONTHS.join('|')})\\s*(?:de\\s*|del\\s*|-|/)?\\s*(20\\d{2})`)))) month = `${mm[2]}-${pad(MONTHS.indexOf(mm[1]) + 1)}`;
  else if ((mm = T.match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})\s*(?:a|al|hasta|-)\s*(\d{1,2})[\/.-](\d{1,2})[\/.-](20\d{2})/))) month = `${mm[6]}-${pad(mm[5])}`;
  return { lines, neto, month };
}

/* Busca la categoría "Principal › Sub"; si no existe, PREGUNTA antes de crearla */
async function resolveCatPath(path, kind, cache) {
  path = (path || '').trim(); if (cache[path] !== undefined) return cache[path];
  const [topName, subName] = path.split(/\s*›\s*|\s*>\s*/);
  if (!topName) return null;
  let top = findTop(topName);
  if (!top) {
    const type = kind === 'aho' ? 'Ahorro' : ['irpf', 'ss', 'emb'].includes(kind) ? 'Gasto fijo' : 'Gasto variable';
    const r = await newCatModal({ name: topName, type, kind: kindOfType(type), intro: `Tu nómina tiene dinero que va a «${esc(topName)}», pero esa categoría no existe. ¿Deseas crearla?` });
    if (!r) return cache[path] = false; top = topOf(r.cat);
  }
  let target = top;
  if (subName) {
    target = findSub(top.id, subName);
    if (!target) target = await confirmBox(`¿Crear la subcategoría «${esc(subName)}»?`, `Irá dentro de «${esc(top.name)}». Si dices que no, el importe se apunta en «${esc(top.name)}».`, 'Sí, crear', 'No')
      ? await createCat({ name: subName, parent: top.id }) : top;
  }
  return cache[path] = target;
}
async function saveNom() {
  const d = S.nom.draft, t = nomTotals(d);
  if (!d.month) return toast('Elige el mes de la nómina');
  if (!(t.neto > 0)) return toast('Falta el líquido a percibir o los importes');
  const cache = {};
  let nomCat = findTop('Nómina') || tops().find(c => c.type === 'Ingreso' && /nomina|salario|sueldo/.test(norm(c.name)));
  if (!nomCat) { const r = await newCatModal({ name: 'Nómina', kind: 'ingreso', type: 'Ingreso', intro: 'Para apuntar tu sueldo hace falta la categoría «Nómina», que no existe. ¿Deseas crearla?' }); if (!r) return; nomCat = r.cat; }
  const id = d.id || uid(), label = `Nómina ${monthName(d.month)}`;
  const [y, m] = d.month.split('-').map(Number); let date = `${d.month}-${pad(new Date(y, m, 0).getDate())}`; if (date > today()) date = today() < `${d.month}-01` ? `${d.month}-01` : today();
  const movs = [];
  if (d.mode === 'bruto') {
    const groups = {}; // ruta de categoría → {kind, amount, concepts}
    const hasEsp = d.lines.some(l => l.kind === 'esp');
    for (const l of d.lines) {
      const a = Math.abs(parseNum(l.amount)) || 0; if (!a || l.kind === 'dev') continue;
      let kind = l.kind, path = l.cat;
      if (kind === 'espded') { if (hasEsp) continue; kind = 'otra'; path = 'Otros gastos › Retribución en especie'; }
      if (kind === 'esp' && !t.espded) continue; // si no se descontó, ya está dentro del neto
      path = (path || NOM_DEFCAT[kind] || 'Otros gastos').trim();
      (groups[path] ||= { kind, amount: 0, concepts: [] }); groups[path].amount += a; groups[path].concepts.push(l.concept);
    }
    let out = 0;
    for (const [path, g] of Object.entries(groups)) {
      const cat = await resolveCatPath(path, g.kind, cache); if (cat === false) return toast('Guardado cancelado');
      movs.push({ cat: cat.id, amount: r2(g.amount), desc: `${label} · ${g.concepts.slice(0, 3).join(', ')}` }); out += g.amount;
    }
    movs.unshift({ cat: nomCat.id, amount: r2(t.neto + out), desc: `${label} (bruto)` });
  } else movs.push({ cat: nomCat.id, amount: r2(t.neto), desc: label });
  // ¿Ya había una nómina apuntada a mano ese mes?
  const nomIds = [nomCat.id, ...subsOf(nomCat.id).map(c => c.id)];
  const manual = S.movs.filter(x => x.date.startsWith(d.month) && nomIds.includes(x.cat) && x.nomina !== id);
  if (manual.length && await confirmBox('Ya tienes la nómina apuntada', `En ${monthName(d.month)} ya hay ${manual.length} ingreso(s) en «${esc(nomCat.name)}» por ${money(manual.reduce((s, x) => s + x.amount, 0))}. ¿Los sustituyo por esta nómina para no contarla dos veces?`, 'Sí, sustituir', 'No, dejar ambos')) {
    for (const x of manual) await DB.del('movs', x.id); S.movs = S.movs.filter(x => !manual.includes(x));
  }
  // Guardar: borrar los movimientos anteriores de esta nómina y crear los nuevos
  const old = S.movs.filter(x => x.nomina === id); for (const x of old) await DB.del('movs', x.id);
  S.movs = S.movs.filter(x => x.nomina !== id);
  const newMovs = movs.map(x => ({ id: uid(), created: Date.now(), date, nomina: id, ...x }));
  await DB.putMany('movs', newMovs); S.movs.push(...newMovs);
  const prev = S.nominas.find(n => n.id === id);
  const rec = { id, month: d.month, mode: d.mode, neto: r2(t.neto), created: prev ? prev.created : Date.now(), file: d.file ? { name: d.file.name, type: d.file.type } : (prev && prev.file) || null,
    lines: d.lines.filter(l => parseNum(l.amount)).map(l => ({ concept: l.concept, kind: l.kind, amount: r2(Math.abs(parseNum(l.amount))), cat: l.cat || '' })) };
  if (d.file && d.file.blob) await DB.put('files', { id: 'nom_' + id, blob: d.file.blob, name: d.file.name, type: d.file.type });
  await DB.put('nominas', rec); S.nominas = S.nominas.filter(n => n.id !== id).concat(rec);
  toast(`Nómina guardada: ${newMovs.length} movimiento(s) ✓`); S.month = d.month; openNom(id);
}

function emergencyFund() {
  const st = S.settings;
  const fixedByMonth = {}; S.movs.forEach(m => { if (typeOf(byId(m.cat)) === 'Gasto fijo') fixedByMonth[m.date.slice(0, 7)] = (fixedByMonth[m.date.slice(0, 7)] || 0) + m.amount; });
  const fm = Object.values(fixedByMonth);
  const fixed = fm.length ? fm.reduce((a, b) => a + b, 0) / fm.length : tops().filter(c => c.type === 'Gasto fijo').reduce((s, c) => s + c.budget, 0);
  const variable = tops().filter(c => c.type === 'Gasto variable').reduce((s, c) => s + c.budget, 0);
  const essentials = fixed + variable, target = essentials * st.efMonths;
  const efCats = S.cats.filter(c => /emergencia/.test(norm(topOf(c).name)));
  const saved = st.efInitial + S.movs.filter(m => efCats.some(c => c.id === m.cat)).reduce((s, m) => s + m.amount, 0);
  const monthly = efCats.filter(c => !c.parent).reduce((s, c) => s + c.budget, 0);
  return { essentials, target, saved, left: target - saved, monthly };
}

  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))) { const y = m[3].length === 2 ? '20' + m[3] : m[3]; return `${y}-${pad(m[2])}-${pad(m[1])}`; }

}
async function importFile(file) {
  toast('Leyendo archivo…');

  let wb; try {
    // Los CSV se leen como texto para no confundir "1.234,56" (formato español) con otros formatos
    wb = isText ? XLSX.read(await file.text(), { type: 'string', raw: true }) : XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  } catch { return toast('No se pudo leer el archivo'); }
  // 1) Si es la plantilla: hoja Configuración con categorías y presupuestos
  const confName = wb.SheetNames.find(n => norm(n).startsWith('configuracion'));
  if (confName) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[confName], { header: 1, defval: '' });
    const h = rows.findIndex(r => r.some(x => norm(x) === 'categoria') && r.some(x => norm(x) === 'tipo'));
    if (h > -1) {
      const ci = rows[h].findIndex(x => norm(x) === 'categoria'), ti = rows[h].findIndex(x => norm(x) === 'tipo'), bi = rows[h].findIndex(x => norm(x).startsWith('presupuesto'));
      const defs = rows.slice(h + 1).map(r => ({ name: String(r[ci] || '').trim(), type: TYPES.find(t => norm(t) === norm(r[ti])), budget: parseNum(r[bi]) || 0 })).filter(d => d.name && d.type);
      const nuevos = defs.filter(d => !findTop(d.name)), cambian = defs.filter(d => { const c = findTop(d.name); return c && c.budget !== d.budget; });
      if (nuevos.length && await confirmBox(`¿Crear ${nuevos.length} categoría(s) nueva(s) de tu plantilla?`, nuevos.map(d => `• ${esc(d.name)} (${d.type})`).join('<br>'), 'Sí, crear', 'No'))
        for (const d of nuevos) await createCat(d);
      if (cambian.length && await confirmBox('¿Actualizar presupuestos?', `La plantilla trae otros presupuestos para ${cambian.length} categoría(s):<br>` + cambian.map(d => `• ${esc(d.name)}: ${money(findTop(d.name).budget)} → ${money(d.budget)}`).join('<br>'), 'Actualizar', 'Dejar como está'))
        for (const d of cambian) { const c = findTop(d.name); c.budget = d.budget; await DB.put('cats', c); }
    }
  }
  // 2) Movimientos
  const sheetName = wb.SheetNames.find(n => norm(n).includes('movimiento')) || wb.SheetNames[0];
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, defval: '', raw: true });
  const isAmt = x => /importe|cantidad|monto|valor|amount|cargo|abono/.test(norm(x));
  const h = rows.findIndex(r => r.some(x => /fecha|date/.test(norm(x))) && r.some(isAmt));
  if (h < 0) return toast('No encontré columnas de Fecha e Importe en el archivo', 3500);
  const H = rows[h].map(norm), col = f => H.findIndex(f);
  const C = { date: col(x => /fecha|date/.test(x)), desc: col(x => /descrip|concepto|detalle|comercio/.test(x)), cat: col(x => /categor/.test(x) && !/sub/.test(x)),
    sub: col(x => /subcat/.test(x)), amt: col(isAmt), type: col(x => /^tipo/.test(x)) };
  const raw = [];
  for (const r of rows.slice(h + 1)) {
    const date = cellDate(r[C.date]); const a = parseNum(r[C.amt]);
    if (!date || !a) continue;
    const tipo = C.type > -1 ? TYPES.find(t => norm(t) === norm(r[C.type])) : null;
    raw.push({ date, desc: C.desc > -1 ? String(r[C.desc]).trim() : '', cat: C.cat > -1 ? String(r[C.cat]).trim() : '', sub: C.sub > -1 ? String(r[C.sub]).trim() : '', amount: Math.abs(a), neg: a < 0, tipo });
  }
  if (!raw.length) return toast('El archivo no tiene movimientos válidos');
  // Categorías que no existen: preguntar una por una
  const map = {};
  const unknown = [...new Set(raw.map(r => r.cat || '(Sin categoría)'))].filter(n => !findTop(n));
  for (const name of unknown) {
    const rs = raw.filter(r => (r.cat || '(Sin categoría)') === name); const sum = rs.reduce((s, r) => s + r.amount, 0);
    const kind = rs[0].tipo ? kindOfType(rs[0].tipo) : rs.every(r => !r.neg) && C.cat < 0 ? 'ingreso' : 'gasto';
    const res = await newCatModal({ name: name === '(Sin categoría)' ? '' : name, askName: name === '(Sin categoría)', kind, type: rs[0].tipo || undefined, allowMap: true,
      intro: `El archivo trae ${name === '(Sin categoría)' ? 'movimientos sin categoría' : `la categoría «${esc(name)}», que no existe`} (${rs.length} movimiento(s), ${money(sum)}). ¿Deseas crearla, usar una existente u omitir esos movimientos?` });
    if (!res) return toast('Importación cancelada');
    map[norm(name)] = res.action === 'skip' ? null : res.cat;
  }
  // Subcategorías nuevas
  const subAsk = {};
  for (const r of raw) {
    const base = map.hasOwnProperty(norm(r.cat || '(Sin categoría)')) ? map[norm(r.cat || '(Sin categoría)')] : findTop(r.cat);
    if (!base || !r.sub || base.parent || findSub(base.id, r.sub)) continue;
    subAsk[base.id + '|' + norm(r.sub)] = { base, name: r.sub };
  }
  for (const k in subAsk) {
    const { base, name } = subAsk[k];
    if (await confirmBox(`¿Crear la subcategoría «${esc(name)}»?`, `El archivo la usa dentro de «${esc(base.name)}». Si dices que no, esos movimientos irán a «${esc(base.name)}».`, 'Sí, crear', 'No')) await createCat({ name, parent: base.id });
  }
  // Guardar sin duplicados
  const keyOf = m => `${m.date}|${m.amount.toFixed(2)}|${norm(m.desc)}|${m.cat}`;
  const existing = new Set(S.movs.map(keyOf)); const nuevos = []; let dup = 0, skip = 0;
  for (const r of raw) {
    let base = map.hasOwnProperty(norm(r.cat || '(Sin categoría)')) ? map[norm(r.cat || '(Sin categoría)')] : findTop(r.cat);
    if (!base) { skip++; continue; }
    const target = (r.sub && !base.parent && findSub(base.id, r.sub)) || base;
    const m = { id: uid(), created: Date.now(), date: r.date, desc: r.desc, cat: target.id, amount: Math.round(r.amount * 100) / 100 };
    const k = keyOf(m); if (existing.has(k)) { dup++; continue; } existing.add(k); nuevos.push(m);
  }
  await DB.putMany('movs', nuevos); S.movs.push(...nuevos);
  await confirmBox('Importación terminada', `✔ ${nuevos.length} movimiento(s) importados<br>${dup ? `• ${dup} duplicado(s) ignorados<br>` : ''}${skip ? `• ${skip} omitido(s)` : ''}`, 'Ver movimientos', 'Cerrar')
    && (S.month = (nuevos[0] || raw[0]).date.slice(0, 7), show('movs'));
}

/* ====================== Sincronización: cifrado, nube y pantalla ====================== */
const b64 = buf => { const a = new Uint8Array(buf); let s = ''; for (let i = 0; i < a.length; i += 0x8000) s += String.fromCharCode.apply(null, a.subarray(i, i + 0x8000)); return btoa(s); };
const unb64 = s => { const bin = atob(s), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a; };
async function deriveKey(email, pass) {
  const te = new TextEncoder(), base = await crypto.subtle.importKey('raw', te.encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: te.encode('mi-presupuesto|' + email.trim().toLowerCase()), iterations: 310000, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function encObj(obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, SY.key, new TextEncoder().encode(JSON.stringify(obj))));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return b64(out);
}
async function decObj(s) {
  const a = unb64(s);
  try { return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: a.subarray(0, 12) }, SY.key, a.subarray(12)))); }
  catch { throw new Error('Los datos de la nube están cifrados con otra contraseña. Cierra sesión y entra con la contraseña con la que los subiste.'); }
}
async function sbClient() {
  if (!SUPA_URL) return null;
  if (!SY.client) { if (!window.supabase) await loadScript(SUPA_JS); SY.client = window.supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: true, autoRefreshToken: true } }); }
  return SY.client;
}
async function localItem(s, id) {
  if (s === 'kv') { const r = await DB.get('kv', id); return r ? r.v : null; }
  const r = await DB.get(s, id); if (!r) return null;
  if (s === 'files') return { id: r.id, name: r.name, type: r.type, data: await fileToDataURL(r.blob) };
  return r;
}
async function applyRemote(s, id, obj) {
  if (s === 'kv') return obj ? RAW.put('kv', { k: id, v: obj }) : null;
  if (!obj) return RAW.del(s, id);
  if (s === 'files') { const blob = await (await fetch(obj.data)).blob(); return RAW.put('files', { id: obj.id, name: obj.name, type: obj.type, blob }); }
  return RAW.put(s, obj);
}
function setSync(status, err = '') { SY.status = status; SY.err = err; if (S.view === 'more' && $('#syncCard')) $('#syncCard').outerHTML = syncCard(), bindSync(); }

// Primera vez que este dispositivo se conecta: las categorías que ya existen en la nube con el mismo nombre
// se unifican (así las 21 categorías de serie no salen duplicadas).
async function dedupeCats() {
  const { data, error } = await SY.client.from('items').select('id,data').eq('store', 'cats').eq('deleted', false);
  if (error) throw error; if (!data.length) return;
  const rc = []; for (const r of data) rc.push(await decObj(r.data));
  const rById = Object.fromEntries(rc.map(c => [c.id, c]));
  const pathOf = (c, all) => { const p = c.parent ? all[c.parent] : null; return norm((p ? p.name + ' › ' : '') + c.name); };
  const rByPath = {}; rc.forEach(c => { rByPath[pathOf(c, rById)] = c.id; });
  const lById = Object.fromEntries(S.cats.map(c => [c.id, c])), remap = {};
  for (const c of S.cats) if (!rById[c.id] && rByPath[pathOf(c, lById)]) remap[c.id] = rByPath[pathOf(c, lById)];
  const ids = Object.keys(remap); if (!ids.length) return;
  for (const m of S.movs) if (remap[m.cat]) { m.cat = remap[m.cat]; await DB.put('movs', m); }
  for (const c of S.cats) if (c.parent && remap[c.parent] && !remap[c.id]) { c.parent = remap[c.parent]; await DB.put('cats', c); }
  for (const id of ids) { await RAW.del('cats', id); delete SY.meta[skey('cats', id)]; }
  S.cats = S.cats.filter(c => !remap[c.id]);
}

async function syncNow() {
  if (!SY.user || !SY.key) return;
  if (SY.busy) { SY.again = true; return; }
  SY.busy = true; SY.again = false; setSync('sync');
  const c = SY.client; let changed = false;
  try {
    const seqRec = await DB.get('kv', 'sync_seq'); let seq = seqRec ? seqRec.v : 0;
    if (!seqRec) {
      await dedupeCats();
      // Lo que ya había en este dispositivo antes de conectarse se sube (si choca con la nube, gana la nube)
      for (const s of SYNCED) for (const k of await DB.tx(s, 'readonly', st => st.getAllKeys())) if (!SY.meta[skey(s, k)]) SY.meta[skey(s, k)] = { u: 1, p: 1 };
      if (await DB.get('kv', 'settings') && !SY.meta['kv|settings']) SY.meta['kv|settings'] = { u: 1, p: 1 };
    }
    // 1) Bajar cambios de la nube (primero solo la lista, luego el contenido de lo que haga falta)
    for (;;) {
      const { data: rows, error } = await c.from('items').select('store,id,deleted,upd,seq').gt('seq', seq).order('seq').limit(500);
      if (error) throw error; if (!rows.length) break;
      const need = rows.filter(r => { const l = SY.meta[skey(r.store, r.id)]; return !(l && (l.p ? l.u > r.upd : l.u >= r.upd)); });
      const bodies = {};
      const want = need.filter(r => !r.deleted), byStore = {};
      want.forEach(r => (byStore[r.store] ||= []).push(r.id));
      for (const [s, ids] of Object.entries(byStore)) {
        const step = s === 'files' ? 1 : 100;
        for (let i = 0; i < ids.length; i += step) {
          const { data, error: e2 } = await c.from('items').select('id,data,upd').eq('store', s).in('id', ids.slice(i, i + step));
          if (e2) throw e2; data.forEach(d => { bodies[skey(s, d.id)] = d; });
        }
      }
      for (const r of need) {
        const k = skey(r.store, r.id);
        if (r.deleted) { await applyRemote(r.store, r.id, null); SY.meta[k] = { u: r.upd, d: 1 }; changed = true; continue; }
        const b = bodies[k]; if (!b) continue;
        await applyRemote(r.store, r.id, await decObj(b.data)); SY.meta[k] = { u: b.upd }; changed = true;
      }
      seq = rows[rows.length - 1].seq; await RAW.put('kv', { k: 'sync_seq', v: seq });
      if (rows.length < 500) break;
    }
    // 2) Subir lo pendiente
    const batch = [];
    const flush = async () => {
      if (!batch.length) return;
      const { error } = await c.rpc('push_items', { p: batch.map(x => x.item) }); if (error) throw error;
      for (const x of batch) { const m = SY.meta[x.k]; if (m && m.u === x.u) delete m.p; }
      batch.length = 0;
    };
    for (const [k, m] of Object.entries(SY.meta)) {
      if (!m.p) continue;
      const i = k.indexOf('|'), s = k.slice(0, i), id = k.slice(i + 1);
      const obj = m.d ? null : await localItem(s, id);
      batch.push({ k, u: m.u, item: { store: s, id, upd: m.u, deleted: !obj, data: obj ? await encObj(obj) : null } });
      if (s === 'files' || batch.length >= 100) await flush();
    }
    await flush();
    await RAW.put('kv', { k: 'sync_meta', v: SY.meta });
    SY.lastOk = Date.now(); setSync('ok');
  } catch (e) {
    console.warn('sync', e);
    setSync('error', !navigator.onLine ? 'Sin conexión: se sincronizará cuando vuelva internet.' : (e.message || String(e)));
  } finally {
    SY.busy = false;
    if (changed) await reloadState();
    if (SY.again) setTimeout(syncNow, 500);
  }
}

  S.cats = await DB.all('cats'); S.movs = await DB.all('movs'); S.nominas = await DB.all('nominas');

const AUTH_ES = [[/invalid login/i, 'Correo o contraseña incorrectos.'], [/not confirmed/i, 'Aún no has confirmado el correo: abre el enlace que te hemos enviado.'],
  [/already registered|already been registered/i, 'Ya existe una cuenta con ese correo: pulsa «Entrar».'], [/at least 6|password should/i, 'La contraseña debe tener al menos 6 caracteres.'],
  [/rate limit|too many/i, 'Demasiados intentos: espera un minuto.'], [/fetch|network/i, 'Sin conexión a internet.'], [/valid email|invalid.*email/i, 'Ese correo no es válido.']];
const authEs = e => { const m = e.message || String(e); const f = AUTH_ES.find(([r]) => r.test(m)); return f ? f[1] : m; };
async function syncLogin(create) {
  const email = $('#syEmail').value.trim(), pass = $('#syPass').value;
  if (!email || !pass) return toast('Escribe correo y contraseña');
  if (create && pass.length < 8) return toast('Usa una contraseña de al menos 8 caracteres');

    const r = create ? await c.auth.signUp({ email, password: pass, options: { emailRedirectTo: location.origin + location.pathname } })
      : await c.auth.signInWithPassword({ email, password: pass });
    if (r.error) throw r.error;
    if (!r.data.session) { setSync('', ''); return confirmBox('Confirma tu correo', `Te hemos enviado un correo a <b>${esc(email)}</b>. Pulsa el enlace que contiene y después vuelve aquí y pulsa <b>Entrar</b>.`, 'Entendido', 'Cerrar'); }
    SY.user = r.data.session.user; SY.email = email; SY.key = await deriveKey(email, pass);
    await RAW.put('kv', { k: 'sync_key', v: SY.key, email });
    toast('Conectado ✓ Sincronizando…'); await syncNow();
  } catch (e) { setSync('error', authEs(e)); }
}
async function syncLogout() {
  if (!await confirmBox('¿Cerrar sesión?', 'Los datos se quedan en este dispositivo, pero dejarán de sincronizarse hasta que vuelvas a entrar.', 'Cerrar sesión', 'Cancelar')) return;
  try { await SY.client.auth.signOut(); } catch {}
  SY.user = null; SY.key = null; await RAW.del('kv', 'sync_key'); await RAW.del('kv', 'sync_seq'); setSync('');
}
function syncCard() {
  if (!SUPA_URL) return `<div class="card" id="syncCard"><h3>☁️ Sincronizar dispositivos</h3><p class="muted" style="margin:0">Todavía no está configurada.</p></div>`;
  const err = SY.err ? `<p class="warn-box" style="margin:10px 0 0">${esc(SY.err)}</p>` : '';
  if (SY.user) {
    const st = SY.status === 'sync' ? '🔄 Sincronizando…' : SY.status === 'error' ? '⚠️ Con problemas' : SY.lastOk ? `✔ Al día · ${new Date(SY.lastOk).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit' })}` : '…';
    return `<div class="card" id="syncCard"><h3>☁️ Sincronizar dispositivos</h3>
      <div class="row between"><span class="muted">Cuenta</span><b>${esc(SY.email || SY.user.email || '')}</b></div>
      <div class="row between" style="margin-top:4px"><span class="muted">Estado</span><span>${st}</span></div>${err}
      <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn sm" id="sySync">Sincronizar ahora</button><button class="btn sm ghost" id="syOut">Cerrar sesión</button></div>
      <p class="muted" style="margin:10px 0 0">Entra con esta misma cuenta en el móvil y en el ordenador y verás lo mismo en los dos. Todo viaja cifrado con tu contraseña.</p></div>`;
  }
  return `<div class="card" id="syncCard"><h3>☁️ Sincronizar dispositivos</h3>
    <p class="muted" style="margin:0 0 10px">Crea una cuenta en un dispositivo y entra con la misma en los demás: lo que apuntes en uno aparecerá en todos.</p>
    <label>Correo</label><input id="syEmail" type="email" autocomplete="username" inputmode="email" value="${esc(SY.email)}">
    <label style="margin-top:8px;display:block">Contraseña</label><input id="syPass" type="password" autocomplete="current-password">
    <div class="row" style="margin-top:12px"><button class="btn" id="syIn" ${SY.status === 'login' ? 'disabled' : ''}>Entrar</button><button class="btn ghost" id="syNew" ${SY.status === 'login' ? 'disabled' : ''}>Crear cuenta</button></div>${err}
    <p class="muted" style="margin:10px 0 0">🔒 Tus datos se cifran en el dispositivo con tu contraseña antes de subirlos: nadie más puede leerlos. Si la olvidas, lo guardado en la nube no se podrá recuperar (lo de cada dispositivo sigue ahí).</p></div>`;
}
function bindSync() {
  if ($('#syIn')) { $('#syIn').onclick = () => syncLogin(false); $('#syNew').onclick = () => syncLogin(true); }
  if ($('#sySync')) { $('#sySync').onclick = () => syncNow(); $('#syOut').onclick = syncLogout; }
}

/* ====================== Arranque ====================== */
async function seedCats() { for (const [name, type, budget] of DEFAULT_CATS) await createCat({ name, type, budget }); }
async function init() {
  await DB.open(); await syncLoadMeta();
  const kv = await DB.get('kv', 'settings'); if (kv) S.settings = { ...S.settings, ...kv.v };
  setFmt();
  S.cats = await DB.all('cats'); S.movs = await DB.all('movs'); S.nominas = await DB.all('nominas');
  if (!S.cats.length && !(await DB.get('kv', 'seeded'))) { await seedCats(); await DB.put('kv', { k: 'seeded', v: true }); }
  $$('#nav button').forEach(b => b.onclick = () => b.dataset.v === 'add' ? newMov() : show(b.dataset.v));
  $('#mPrev').onclick = () => shiftMonth(-1); $('#mNext').onclick = () => shiftMonth(1);
  $('#modal').onclick = e => { if (e.target.id === 'modal') { const c = $('[data-close]', $('#sheet')); if (c) c.click(); } };
  show('panel');
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  syncStart();
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); S.installEvt = e; if (S.view === 'more') renderMore(); });
init().catch(e => { document.body.innerHTML = '<p style="padding:20px">No se pudo abrir la base de datos del navegador: ' + esc(e.message) + '</p>'; });
</script>
